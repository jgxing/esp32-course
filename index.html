<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 嵌入式系统 · 交互实验室</title>
<meta name="description" content="面向嵌入式系统课程的 ESP32 交互式学习平台：硬件认知、原理讲解、可运行实验仿真、波形与协议时序可视化、自测评估。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d7c72'/%3E%3Crect x='16' y='16' width='32' height='32' rx='5' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M22 32h6l4-9 5 18 4-9h3' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <!-- ============ 顶栏 ============ -->
  <header class="topbar">
    <button class="icon-btn menu-toggle" id="menuToggle" aria-label="打开目录" title="目录">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <rect x="8" y="6" width="24" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="13" y="12" width="14" height="11" rx="1.5" fill="currentColor" opacity=".28"/>
          <path d="M12 3v3M20 3v3M28 3v3M12 34v3M20 34v3M28 34v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M15 18h10M20 18v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
        </svg>
      </div>
      <div class="brand-text">
        <strong>ESP32 交互实验室</strong>
        <span>嵌入式系统课程 · Interactive Courseware</span>
      </div>
    </div>

    <div class="top-progress" title="课程学习进度">
      <div class="top-progress-head">
        <span>学习进度</span><b id="progressText">0 / 0</b>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" id="themeIcon"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
      <button class="icon-btn" id="resetProgress" title="重置学习进度" aria-label="重置学习进度">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  </header>

  <div class="body-row">

    <!-- ============ 侧边导航 ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-scroll">
        <div class="side-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input type="text" id="sideSearch" placeholder="搜索章节 / 实验…" autocomplete="off">
        </div>
        <nav id="navList" aria-label="课程目录"></nav>
        <div class="side-foot">
          <div class="side-foot-title">课程信息</div>
          <p>面向本科《嵌入式系统》课程<br>理论 + 10 个可交互实验</p>
          <div class="side-badges">
            <span>ESP32-WROOM-32</span><span>Arduino / ESP-IDF</span><span>无硬件也能做实验</span>
          </div>
        </div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ============ 主内容 ============ -->
    <main class="main" id="main">
      <div id="view" class="view"></div>
      <footer class="page-footer">
        <span id="footerCrumb">课程概览</span>
        <span class="footer-right">ESP32 嵌入式系统 · 交互实验室 · 本地离线可用</span>
      </footer>
    </main>
  </div>
</div>

<!-- 引脚信息浮层 -->
<div class="pin-popover" id="pinPopover" role="dialog" aria-label="引脚详情"></div>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/labs.js"></script>
<script src="js/labs-a.js"></script>
<script src="js/labs-b.js"></script>
<script src="js/app.js"></script>
</body>
</html>
